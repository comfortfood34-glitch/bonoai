[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bonoai"
version = "0.2.0"
description = "Pipeline científico e reproduzível para análise da Bonoloto."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2.0"]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "streamlit>=1.40,<2.0",
]

[project.scripts]
bonoai = "bonoai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bonoai"]
omit = [
  "src/bonoai/__main__.py",
  "src/bonoai/ports/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
